spring:
  application:
    name: gtublog-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gtublog}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:gtublog}
    password: ${MYSQL_PASSWORD:replace-with-local-password}
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: GtuBlogScheduler
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            isClustered: true
            tablePrefix: QRTZ_

app:
  auth:
    issuer: ${AUTH_ISSUER:https://gtublog.local}
    audience: ${AUTH_AUDIENCE:gtublog-admin}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT10M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P14D}
    allowed-origins:
      - ${AUTH_ALLOWED_ORIGIN:http://localhost:3000}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
      domain: ${AUTH_COOKIE_DOMAIN:}
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:Administrator}
    keys:
      public-key-pem: ${AUTH_PUBLIC_KEY_PEM:}
      private-key-pem: ${AUTH_PRIVATE_KEY_PEM:}
  automation:
    collection:
      allowed-private-hosts: ${AUTOMATION_COLLECTION_ALLOWED_PRIVATE_HOSTS:}
    run:
      pipeline-lease-duration: ${AUTOMATION_RUN_PIPELINE_LEASE_DURATION:PT10M}
      max-duration: ${AUTOMATION_RUN_MAX_DURATION:PT30M}
      recovery-interval: ${AUTOMATION_RUN_RECOVERY_INTERVAL:PT1M}
    worker:
      shared-token: ${AUTOMATION_WORKER_SHARED_TOKEN:}
      lease-duration: ${AUTOMATION_WORKER_LEASE_DURATION:PT5M}
      preferred-provider: ${AUTOMATION_WORKER_PROVIDER:codex-sdk}
      schema-version: ${AUTOMATION_WORKER_SCHEMA_VERSION:automation-job-v1}
    revalidation:
      base-url: ${AUTOMATION_REVALIDATION_BASE_URL:}
      shared-secret: ${AUTOMATION_REVALIDATION_SHARED_SECRET:}
      retry-delay: ${AUTOMATION_REVALIDATION_RETRY_DELAY:PT1M}
