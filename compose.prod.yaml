name: gtublog-prod

services:
  proxy:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./ops/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      GTUBLOG_SITE_URL: ${PUBLIC_ORIGIN:-https://blog.example.com}
      GTUBLOG_PUBLIC_API_BASE_URL: ${GTUBLOG_PUBLIC_API_BASE_URL:-http://backend:8080/api/v1/public}
      GTUBLOG_APPLICATION_API_BASE_URL: ${GTUBLOG_APPLICATION_API_BASE_URL:-http://backend:8080/api/v1}
      NEXT_PUBLIC_GTUBLOG_APPLICATION_API_BASE_URL: ${NEXT_PUBLIC_GTUBLOG_APPLICATION_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_GTUBLOG_ENABLE_DEV_MOCKS: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gtublog}
      MYSQL_USER: ${MYSQL_USER:-gtublog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-replace-with-production-password}
      AUTH_ALLOWED_ORIGIN: ${PUBLIC_ORIGIN:-https://blog.example.com}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://blog.example.com}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-gtublog-admin}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-replace-with-production-admin-password}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-Administrator}
      AUTH_PUBLIC_KEY_PEM: ${AUTH_PUBLIC_KEY_PEM:-}
      AUTH_PRIVATE_KEY_PEM: ${AUTH_PRIVATE_KEY_PEM:-}
      AUTOMATION_COLLECTION_ALLOWED_PRIVATE_HOSTS: ${AUTOMATION_COLLECTION_ALLOWED_PRIVATE_HOSTS:-}
      AUTOMATION_WORKER_SHARED_TOKEN: ${AUTOMATION_WORKER_SHARED_TOKEN:-replace-with-production-worker-token}
      AUTOMATION_REVALIDATION_BASE_URL: ${AUTOMATION_REVALIDATION_BASE_URL:-https://blog.example.com}
      AUTOMATION_REVALIDATION_SHARED_SECRET: ${AUTOMATION_REVALIDATION_SHARED_SECRET:-replace-with-production-revalidation-secret}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  generation-worker:
    build:
      context: .
      dockerfile: generation-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    user: worker
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /home/worker:rw,noexec,nosuid,nodev,size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      GENERATION_BACKEND_BASE_URL: ${GENERATION_BACKEND_BASE_URL:-http://backend:8080}
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:-replace-with-production-worker-token}
      GENERATION_WORKER_ID: ${GENERATION_WORKER_ID:-gtublog-worker}
      GENERATION_CODEX_ENV_ISOLATION_APPROVED: ${GENERATION_CODEX_ENV_ISOLATION_APPROVED:-false}
      GENERATION_CODEX_CANARY_ATTESTATION_PATH: ${GENERATION_CODEX_CANARY_ATTESTATION_PATH:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      GENERATION_POLL_INTERVAL_MS: ${GENERATION_POLL_INTERVAL_MS:-5000}
      GENERATION_REQUEST_TIMEOUT_MS: ${GENERATION_REQUEST_TIMEOUT_MS:-10000}
      GENERATION_HEARTBEAT_INTERVAL_MS: ${GENERATION_HEARTBEAT_INTERVAL_MS:-30000}
      GENERATION_TIMEOUT_MS: ${GENERATION_TIMEOUT_MS:-240000}
      GENERATION_LEASE_SAFETY_MARGIN_MS: ${GENERATION_LEASE_SAFETY_MARGIN_MS:-45000}
      GENERATION_SHUTDOWN_GRACE_MS: ${GENERATION_SHUTDOWN_GRACE_MS:-20000}
      GENERATION_ERROR_BACKOFF_MIN_MS: ${GENERATION_ERROR_BACKOFF_MIN_MS:-1000}
      GENERATION_ERROR_BACKOFF_MAX_MS: ${GENERATION_ERROR_BACKOFF_MAX_MS:-60000}
      GENERATION_HEALTH_FILE: /tmp/gtublog-worker-health.json
      GENERATION_READINESS_MAX_AGE_MS: ${GENERATION_READINESS_MAX_AGE_MS:-120000}

  prometheus:
    profiles: ["ops"]
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/production.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["ops"]
    image: grafana/grafana:13.0.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-local-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-replace-with-production-grafana-password}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
