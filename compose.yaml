name: gtublog

services:
  generation-worker:
    profiles: ["generation"]
    build:
      context: .
      dockerfile: generation-worker/Dockerfile
    restart: unless-stopped
    user: worker
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /home/worker:rw,noexec,nosuid,nodev,size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      GENERATION_BACKEND_BASE_URL: ${GENERATION_BACKEND_BASE_URL:-http://host.docker.internal:8080}
      GENERATION_WORKER_TOKEN: ${GENERATION_WORKER_TOKEN:-}
      GENERATION_WORKER_ID: ${GENERATION_WORKER_ID:-gtublog-worker}
      GENERATION_CODEX_ENV_ISOLATION_APPROVED: ${GENERATION_CODEX_ENV_ISOLATION_APPROVED:-false}
      GENERATION_CODEX_CANARY_ATTESTATION_PATH: ${GENERATION_CODEX_CANARY_ATTESTATION_PATH:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      GENERATION_POLL_INTERVAL_MS: ${GENERATION_POLL_INTERVAL_MS:-5000}
      GENERATION_REQUEST_TIMEOUT_MS: ${GENERATION_REQUEST_TIMEOUT_MS:-10000}
      GENERATION_HEARTBEAT_INTERVAL_MS: ${GENERATION_HEARTBEAT_INTERVAL_MS:-30000}
      GENERATION_TIMEOUT_MS: ${GENERATION_TIMEOUT_MS:-240000}
      GENERATION_LEASE_SAFETY_MARGIN_MS: ${GENERATION_LEASE_SAFETY_MARGIN_MS:-45000}
      GENERATION_SHUTDOWN_GRACE_MS: ${GENERATION_SHUTDOWN_GRACE_MS:-20000}
      GENERATION_ERROR_BACKOFF_MIN_MS: ${GENERATION_ERROR_BACKOFF_MIN_MS:-1000}
      GENERATION_ERROR_BACKOFF_MAX_MS: ${GENERATION_ERROR_BACKOFF_MAX_MS:-60000}
      GENERATION_HEALTH_FILE: /tmp/gtublog-worker-health.json
      GENERATION_READINESS_MAX_AGE_MS: ${GENERATION_READINESS_MAX_AGE_MS:-120000}

  mysql:
    image: mysql:8.4.10@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gtublog}
      MYSQL_USER: ${MYSQL_USER:-gtublog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-replace-with-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace-with-local-root-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.0.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-local-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-replace-with-local-grafana-password}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
